<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Acceso — Pupilos Barber</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23C9A24B' stroke-width='1.4'/%3E%3Cpath d='M16 6 L16 26' stroke='%23C9A24B' stroke-width='1.2' transform='rotate(24 16 16)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
  <header class="admin-bar">
    <a class="logo" href="index.html" aria-label="Pupilos Barber, inicio">
      <span class="logo-mark" aria-hidden="true"></span>
      <span class="logo-text">Pupilos Barber</span>
    </a>
  </header>
  <main class="login-main">
    <div class="login-card">
      <p class="kicker">Panel</p>
      <h1>Acceso</h1>
      <p>Solo para el equipo de la barbería.</p>
      <form data-login>
        <label>
          Correo
          <input name="email" type="email" autocomplete="username" required>
        </label>
        <label>
          Contraseña
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="form-error" data-login-error role="alert" hidden></p>
        <button class="btn btn-dark btn-block" type="submit" data-login-submit>Entrar</button>
      </form>
    </div>
  </main>
  <script type="module" src="js/admin-login.js"></script>
</body>
</html>
